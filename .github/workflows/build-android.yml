
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -o FruitCraftSmartFarmer-project.zip -d android-project

      - name: Build debug APK
        run: gradle -p android-project --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FruitCraftSmartFarmer-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
